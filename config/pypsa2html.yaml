# négaWatt Belgium study (PyPSA-Eur, repo: pypsa-eur_negawatt).
#
# Reproduces the report the legacy scripts produced from
# `results/{ref,suff}`. Run from the pypsa-eur_negawatt repository root:
#
#     pypsa2html build --config /path/to/pypsa2html/config/negawatt.yaml
#
# `root` is where the relative paths below resolve; override it on the command
# line with `--root` if you keep the results elsewhere.
root: /home/umair/pypsa-eur_master

project:
  name: EU sufficiency scenario
  subtitle: Energy transition pathways to 2050
  website: https://www.clever.com/
  decimals: 3

model:
  clusters: 33
  opts: ""
  # Must match the solved networks' sector_opts token (filename pattern).
  sector_opts: ""
  planning_horizons: null      # discovered from results/<scenario>/networks/

nodes:
  detect: true
  focus: BE0 0        
  labels:
    AT0 0: Austria
    BE0 0: Belgium
    BG0 0: Bulgaria
    CH0 0: Switzerland
    CZ0 0: Czechia
    DE0 0: Germany
    DK0 0: Denmark
    DK1 0: Denmark
    EE0 0: Estonia
    ES0 0: Spain
    ES6 0: Spain
    FI1 0: Finland
    FR0 0: France
    FR5 0: France
    GB2 0: Great Britain
    GB3 0: Great Britain
    GR0 0: Greece
    HR0 0: Croatia
    HU0 0: Hungary
    IE3 0: Ireland
    IT0 0: Italy
    IT4 0: Italy
    LT0 0: Lithuania
    LU0 0: Luxemburg
    LV0 0: Latvia
    NL0 0: Netherlands
    NO1 0: Norway
    PL0 0: Poland
    PT0 0: Portugal
    RO0 0: Romania
    SE1 0: Sweden
    SI0 0: Slovenia
    SK0 0: Slovakia
  aggregate:
    enabled: true
    # The legacy tool called this "EU", which collides with the real PyPSA-Eur
    # `EU` bus location (global oil/gas/coal buses). Kept here only so the
    # output file names match the existing results/ref/htmls/EU_*.html.
    # New projects should leave it at the default "ALL".
    code: EU
    label: 28 countries
  # Belgium total = the three NUTS-1 regions, not the 5-country sum.
  # Explicit members only — never `.str[:2]` / prefix matching.
  groups:
    - code: DK0 0
      label: Denmark
      members: [DK0 0, DK1 0]
    - code: ES0 0
      label: Spain
      members: [ES0 0, ES6 0]
    - code: FR0 0
      label: France
      members: [FR0 0, FR5 0]
    - code: GB2 0
      label: Great Britain
      members: [GB2 0, GB3 0]
    - code: IT0 0
      label: Italy
      members: [IT0 0, IT4 0]

scenarios:
  - name: ref
    label: Reference
    results_dir: results/ref
    resources_dir: resources/ref
  - name: suff
    label: Sufficiency
    results_dir: results/suff
    resources_dir: resources/suff

landing:
  scenario: ref
  node: BE0 0
  page: overview

output:
  dir: results/{scenario}/html
  pages: [overview, emissions, sankeys, fec, demands, costs, capacities, dispatch, maps]
  shared_maps: true
  plotly: cdn

plots:
  ghg_cum_by_source: false
  res_share: false
  fec_by_origin: false
  domestic_share: false
  secondary_mix: false

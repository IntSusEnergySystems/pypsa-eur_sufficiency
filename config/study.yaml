- LT
- LU
- LV
- NL
- 'NO'
- PL
- PT
- RO
- SE
- SI
- SK

clustering:
  cluster_network:
    n_clusters: 33

solving:
  solver:
    name: gurobi
    options: gurobi-numeric-focus
  mem_mb: 900000
  runtime: 48h

self_sufficiency:
  self_sufficiency_constraint: false
  level: 0.7


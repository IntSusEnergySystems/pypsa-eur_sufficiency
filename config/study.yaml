%YAML 1.1
---
# Single workflow for this fork.
# ref: reference demands, sequestration and CCS allowed.
# suff: CLEVER demands, same technology options as ref (including CCS and DAC).
# suff-nocdr: CLEVER demands, no sequestration, DAC or BECCS (CCU only).
# Loaded by the Snakefile on top of config/config.default.yaml.
# config/config.yaml, if present, is applied afterwards.

run:
  name: all
  scenarios:
    enable: true
    file: config/study_scenarios.yaml

foresight: myopic

planning_horizons:
- 2030
- 2040
- 2050

countries:
- AT
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GB
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- NL
- 'NO'
- PL
- PT
- RO
- SE
- SI
- SK

clustering:
  # One node per country. Level 0 is the country boundary.
  # Keep this in the same block as temporal settings. A second clustering
  # key later in this file replaces the whole section.
  mode: administrative
  administrative:
    level: 0
  cluster_network:
    n_clusters: 28
  temporal:
    averaging: 6h

solving:
  solver:
    name: gurobi
    options: gurobi-numeric-focus
  mem_mb: 900000
  runtime: 48h

self_sufficiency:
  self_sufficiency_constraint: false
  level: 0.7

co2_budget:
  upper:
    2020: 0.72
    2025: 0.648
    2030: 0.45
    2035: 0.25
    2040: 0.1
    2045: 0.05
    2050: 0.0


%YAML 1.1
---
# Single workflow for this fork: reference (ref) and sufficiency (suff).
# Loaded by the Snakefile on top of config/config.default.yaml.
# config/config.yaml, if present, is applied afterwards.

run:
  name: all
  scenarios:
    enable: true
    file: config/study_scenarios.yaml

foresight: myopic

planning_horizons:
- 2030
- 2040
- 2050

countries:
- AT
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI

# Scenario name is the run name used by the sufficiency and reference paths.
# suff uses CLEVER demands and the same CCS, DAC and sequestration options as ref.
# suff-nocdr uses CLEVER demands but allows only CCU.
ref:
  run:
    name: ref
suff:
  run:
    name: suff
  industry:
    # Always the future best-in-class ratios. Reference keeps the blend in config.default.yaml.
    sector_ratios_fraction_future:
      2020: 1.0
      2025: 1.0
      2030: 1.0
      2035: 1.0
      2040: 1.0
      2045: 1.0
      2050: 1.0
suff-nocdr:
  run:
    name: suff-nocdr
  industry:
    sector_ratios_fraction_future:
      2020: 1.0
      2025: 1.0
      2030: 1.0
      2035: 1.0
      2040: 1.0
      2045: 1.0
      2050: 1.0
  sector:
    dac: false
    SMR_cc: false
    co2_sequestration_potential:
      2020: 0
      2025: 0
      2030: 0
      2035: 0
      2040: 0
      2045: 0
      2050: 0
    regional_co2_sequestration_potential:
      enable: false
